name: Android APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout upstream Rust parser sources
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-anything
          ref: 63801a686eaa66ea91f8a252025088d6a54992e3
          path: upstream

      - name: Extract Android project
        run: |
          test -f CraftAnything-Android-Phase10.zip || { echo "::error::CraftAnything-Android-Phase10.zip not found in repository root."; exit 1; }
          unzip -q CraftAnything-Android-Phase10.zip -d .
          test -f craft-anything-android/app/build.gradle.kts
          python3 scripts/patch_android_beginner_ui.py
          python3 scripts/patch_android_project_builder.py
          python3 scripts/patch_android_visual_check.py
          python3 -m py_compile scripts/patch_android_visual_check.py
          python3 scripts/patch_android_local_task_model.py
          python3 -m py_compile scripts/patch_android_local_task_model.py
          echo 'Local MediaPipe task adapter patch validated.'
          python3 - <<'PY'
          from pathlib import Path
          p = Path("craft-anything-android/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace("VERSION_1_8", "VERSION_17")
          s += "\n// Align Android Java compilation with Kotlin JVM 17.\nandroid {\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n}\n"
          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          replacements = {
              "WORKSPACE / 01": "작업 공간 / 01",
              "What would you like to analyze?": "무엇을 분석할까요?",
              "APK · DEX · ZIP · ELF · PE": "APK · DEX · ZIP · ELF · PE",
              "Files are read and analyzed locally with the Rust parser. The selected file is not executed.": "파일은 기기 안에서 Rust 분석기로 읽습니다. 선택한 파일을 실행하지 않습니다.",
              "Change file": "파일 변경",
              "Analyze on device": "기기에서 분석하기",
              "ANALYSIS / OVERVIEW": "분석 / 개요",
              "Upstream format parsers are not linked. Build with CRAFT_ANDROID_WITH_UPSTREAM_FORMATS=1.": "사용 방법: [파일 변경]에서 파일을 선택한 뒤 [기기에서 분석하기]를 누르세요. 이 빌드에는 upstream 확장 형식 파서가 포함되어 있습니다. 분석 후 [상세 도구]에서 결과를 살펴보고 [AI 분석]에서 질문할 수 있습니다. 단, 데스크톱용 전체 AI 에이전트 엔진은 아직 Android에 연결되지 않았습니다.",
              "Detailed Tools": "상세 도구",
              "Class search, method disassembly and Rust tools": "클래스 검색, 메서드 디스어셈블 및 Rust 도구",
              "AI Analysis": "AI 분석",
              "Ask questions based on analysis results and check the evidence.": "분석 결과를 바탕으로 질문하고 근거를 확인하세요.",
              "Open": "열기",
              "Quick": "간편",
              "Expert": "전문가",
              "Home": "홈",
              "Settings": "설정",
          }
          roots = [Path("craft-anything-android/app/src")]
          for root in roots:
              if not root.exists():
                  continue
              for p in root.rglob("*"):
                  if p.suffix not in {".kt", ".xml"}:
                      continue
                  try:
                      original = p.read_text()
                  except UnicodeDecodeError:
                      continue
                  updated = original
                  for old, new in replacements.items():
                      pattern = r'(?<=["\'])' + re.escape(old) + r'(?=["\'])'
                      updated = re.sub(pattern, lambda _m: new, updated)
                  if updated != original:
                      p.write_text(updated)
          PY
      - name: Package extracted Android source for implementation review
        run: |
          tar -czf /tmp/craft-anything-android-source.tar.gz craft-anything-android
      - name: Upload extracted Android source
        uses: actions/upload-artifact@v4
        with:
          name: craft-anything-android-source
          path: /tmp/craft-anything-android-source.tar.gz
          retention-days: 3

      - name: Inspect Android source layout for local model integration
        run: |
          echo '--- source files ---'
          find craft-anything-android -maxdepth 5 -type f | sort | head -200
          echo '--- AI settings and provider references ---'
          grep -RniE 'Ollama|provider|API 주소|API 키|modelId|model_id|Settings' craft-anything-android/app/src --include='*.kt' | head -240 || true
          echo '--- native crate files ---'
          find craft-anything-android/native -maxdepth 4 -type f -print | sort

      - name: Test upstream format parser crate
        working-directory: upstream
        run: cargo test --locked -p craft-anything-formats --lib

      - name: Add Android project to upstream workspace
        run: |
          mkdir -p upstream/apps
          cp -a craft-anything-android upstream/apps/craft-anything-android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust JNI libraries with upstream format parsers
        working-directory: upstream/apps/craft-anything-android
        env:
          CRAFT_ANDROID_WITH_UPSTREAM_FORMATS: '1'
          CRAFT_ANDROID_WITH_UPSTREAM_ENGINE: '0'
        run: ./native/build-android.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle wrapper
        working-directory: upstream/apps/craft-anything-android
        run: gradle wrapper --gradle-version 8.9

      - name: Build debug APK
        if: github.event_name == 'workflow_dispatch'
        working-directory: upstream/apps/craft-anything-android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: craft-anything-android-debug
          path: upstream/apps/craft-anything-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build release APK
        if: github.event_name == 'workflow_dispatch'
        working-directory: upstream/apps/craft-anything-android
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload release APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: craft-anything-android-release
          path: upstream/apps/craft-anything-android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30
