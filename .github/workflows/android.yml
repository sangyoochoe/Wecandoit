name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          test -f CraftAnything-Android-Phase10.zip || { echo "::error::CraftAnything-Android-Phase10.zip not found in repository root."; exit 1; }
          unzip -q CraftAnything-Android-Phase10.zip -d .
          test -f craft-anything-android/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-unknown-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Prepare standalone Rust bridge
        working-directory: craft-anything-android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("native/Cargo.toml")
          s = p.read_text()
          s = s.replace('upstream-engine = ["dep:craft-anything-engine"]', 'upstream-engine = []')
          s = s.replace('upstream-formats = ["dep:craft-anything-formats"]', 'upstream-formats = []')
          s = s.split('\n[dependencies.craft-anything-engine]\n', 1)[0].rstrip() + '\n'
          p.write_text(s)
          PY

      - name: Build Rust JNI libraries
        working-directory: craft-anything-android
        env:
          CRAFT_ANDROID_WITH_UPSTREAM_FORMATS: '0'
          CRAFT_ANDROID_WITH_UPSTREAM_ENGINE: '0'
        run: ./native/build-android.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle wrapper
        working-directory: craft-anything-android
        run: gradle wrapper --gradle-version 8.9

      - name: Build debug APK
        working-directory: craft-anything-android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: craft-anything-android-debug
          path: craft-anything-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build release APK
        if: github.event_name != 'pull_request'
        working-directory: craft-anything-android
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: craft-anything-android-release
          path: craft-anything-android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30
