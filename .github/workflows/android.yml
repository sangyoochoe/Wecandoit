name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate Gradle wrapper
        run: |
          test -f ./gradlew || { echo "::error::Gradle wrapper (./gradlew) is missing. Upload the Android project first."; exit 1; }
          test -f ./gradle/wrapper/gradle-wrapper.properties || { echo "::error::Gradle wrapper properties are missing."; exit 1; }
          chmod +x ./gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: craft-anything-android-debug
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build release APK
        if: github.event_name != 'pull_request'
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: craft-anything-android-release
          path: |
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30
